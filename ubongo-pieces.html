<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>board-vision: check the Ubongo pieces</title>
  <meta name="description" content="Debug: each of the 16 Ubongo pieces as the game knows it, next to a photo, to tick off.">
  <!-- Installable app (issue #151): manifest, icons, full screen from the home screen. -->
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="board-vision">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="ubongo-pieces-check.js"></script>
</head>
<body class="plain">
  <header>
    <h1>Check the 16 Ubongo pieces</h1>
    <a href="./#ubongo">Open the game</a>
  </header>
  <main>
    <p>Each piece as the game knows it (drag the model to turn it) next to the owner's photo. Tap ✓ when the
      model is the same solid as the real piece, ✗ when not. Then copy the line at the bottom into a comment on the issue.</p>
    <div id="pieces" class="tiles"></div>
    <h2>Result</h2>
    <p><textarea id="result" rows="3" cols="60" readonly aria-label="Result"></textarea></p>
    <div class="controls"><button id="copy-button" type="button">Copy result</button></div>
  </main>
</body>
</html>
